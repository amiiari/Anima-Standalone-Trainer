<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRA Epoch Viewer</title>
    <!-- Exported by the Anima trainer's Compare tab. Opens offline: everything it needs is in this folder. -->
    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --raised: #21262d; --border: #30363d;
            --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --good: #3fb950;
            --s-check: #3987e5; --s-train: #d95926;
        }
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg: #ffffff; --panel: #f6f8fa; --raised: #eaeef2; --border: #d0d7de;
                --text: #1f2328; --muted: #57606a; --accent: #0969da; --good: #1a7f37;
                --s-check: #2a78d6; --s-train: #eb6834;
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .muted { color: var(--muted); font-size: 13px; }
        code { background: var(--raised); padding: 1px 6px; border-radius: 4px; }
        .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .thumb { flex: 0 0 auto; width: 84px; height: 112px; border: 2px solid var(--border); border-radius: 6px; overflow: hidden; cursor: pointer; background: var(--raised); padding: 0; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb.sel { border-color: var(--accent); }
        .epochbar { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .epochbar input[type=range] { flex: 1; min-width: 160px; }
        .epochbar .lbl { min-width: 170px; text-align: right; font-variant-numeric: tabular-nums; }
        select { background: var(--raised); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
        .wipe { position: relative; user-select: none; cursor: ew-resize; background: var(--raised); border-radius: 6px; overflow: hidden; min-height: 300px; display: grid; place-items: center; touch-action: none; }
        .wipe .stage { position: relative; display: inline-block; line-height: 0; }
        .wipe .stage > img { display: block; max-width: 100%; max-height: 72vh; pointer-events: none; }
        /* the right side covers exactly the left image's box, so both sides line up even if their shapes differ a little */
        .wipe .stage > .over { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .wipe .divider { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.6); pointer-events: none; }
        .wipe .corner { position: absolute; top: 8px; font-size: 12px; background: rgba(0,0,0,.65); color: #fff; padding: 2px 8px; border-radius: 4px; pointer-events: none; }
        .wipe .empty { color: var(--muted); padding: 40px; }
        #chart { width: 100%; height: 240px; display: block; }
        #chart text { fill: var(--muted); font-size: 11px; }
        .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
        .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
        #tip { position: fixed; pointer-events: none; background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; display: none; z-index: 10; }
        table { border-collapse: collapse; font-size: 13px; }
        td, th { padding: 3px 14px 3px 0; text-align: left; }
        .prompt { font-size: 12px; color: var(--muted); margin-top: 8px; word-break: break-word; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="panel">
            <h1 id="title"></h1>
            <div class="muted" id="meta"></div>
        </div>
        <div class="panel">
            <div class="strip" id="strip"></div>
            <div class="muted" style="margin-top:6px">↑/↓ switch image · ←/→ change epoch · drag across the image to compare the two sides</div>
        </div>
        <div class="panel">
            <div class="epochbar">
                <select id="left" title="Left side"></select>
                <input id="epoch" type="range" min="0" max="0" value="0">
                <span class="lbl" id="epoch-label"></span>
            </div>
            <div class="wipe" id="wipe"></div>
            <div class="muted" id="epoch-file" style="margin-top:6px"></div>
            <div class="prompt" id="prompt"></div>
        </div>
        <div class="panel" id="loss-panel">
            <div class="legend">
                <span><i style="background:var(--s-train)"></i>Train loss (smoothed)</span>
                <span><i style="background:var(--s-check)"></i>Fixed-noise check</span>
                <span><i style="height:0; border-top:2px dashed var(--good)"></i>Learning flattens</span>
            </div>
            <svg id="chart" role="img" aria-label="Loss per epoch"></svg>
            <div class="muted" id="loss-note"></div>
        </div>
        <div class="panel">
            <strong>Files</strong>
            <table id="files"></table>
        </div>
    </div>
    <div id="tip"></div>

    <script id="data" type="application/json">__DATA__</script>
    <script>
        const D = JSON.parse(document.getElementById('data').textContent);
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const cols = D.columns;
        let sel = 0, col = cols.length - 1, wipeAt = 0.5;

        document.title = `${D.title}: epochs`;
        $('title').textContent = D.title;
        $('meta').innerHTML = [
            D.trigger && `Trigger: <code>${esc(D.trigger)}</code>`,
            D.baseModel && `Base model: <code>${esc(D.baseModel)}</code>`,
            `Images rendered at LoRA weight ${D.weight}`,
        ].filter(Boolean).join(' · ');

        const flattens = (() => {
            const v = D.losses.epochs.filter(e => e.check != null);
            if (v.length < 3) return null;
            const min = Math.min(...v.map(e => e.check)), drop = v[0].check - min;
            return v.find(e => e.check - min <= drop * 0.1).epoch;
        })();

        $('strip').innerHTML = D.samples.map((s, i) => `<button class="thumb" data-i="${i}" title="Image ${i + 1}"><img src="${esc(s.original)}" alt=""></button>`).join('');
        $('strip').querySelectorAll('.thumb').forEach(b => b.onclick = () => { sel = +b.dataset.i; render(); });
        $('left').innerHTML = `<option value="original">Original</option>` + cols.map(c => `<option value="${esc(c.key)}">${esc(c.label)}</option>`).join('');
        $('epoch').max = cols.length - 1;
        $('epoch').oninput = () => { col = +$('epoch').value; render(); };
        $('left').onchange = render;
        $('files').innerHTML = '<tr><th>Epoch</th><th>File</th></tr>' + cols.filter(c => c.file).map(c =>
            `<tr><td>${esc(c.label)}${c.epoch === flattens ? ' ★' : ''}</td><td><code>${esc(c.file)}</code></td></tr>`).join('');

        function src(s, key) { return key === 'original' ? s.original : s.renders[key] || null; }
        function label(key) { return key === 'original' ? 'Original' : cols.find(c => c.key === key).label; }
        let lastKey = '';
        function render() {
            const s = D.samples[sel];
            $('strip').querySelectorAll('.thumb').forEach((b, i) => b.classList.toggle('sel', i === sel));
            $('epoch').value = col;
            const c = cols[col], e = D.losses.epochs.find(x => x.epoch === c.epoch);
            $('epoch-label').textContent = c.label + (e?.check != null ? ` · check ${e.check.toFixed(4)}` : '') + (c.epoch != null && c.epoch === flattens ? ' ★' : '');
            $('epoch-file').innerHTML = c.file ? `Like this one? Its LoRA file: <code>${esc(c.file)}</code>` : '';
            const lk = $('left').value, l = src(s, lk), r = src(s, c.key);
            const key = `${sel}|${lk}|${c.key}`;
            if (key !== lastKey) {
                lastKey = key;
                // the left image sizes the stage; the right one is laid exactly over it
                const base = l || r, over = l ? r : null;
                $('wipe').innerHTML = (base ? `<div class="stage" id="stage"><img src="${esc(base)}" alt="">${over ? `<img class="over" id="wr" src="${esc(over)}" alt=""><div class="divider" id="wd"></div>` : ''}</div>` : '')
                    + (!l || !r ? `<div class="empty">${esc(!r ? c.label : label(lk))}: no image</div>` : '')
                    + `<span class="corner" style="left:8px">${esc(label(lk))}</span><span class="corner" style="right:8px">${esc(c.label)}</span>`;
            }
            if ($('wr')) {
                $('wr').style.clipPath = `inset(0 0 0 ${wipeAt * 100}%)`;
                $('wd').style.left = `calc(${wipeAt * 100}% - 1px)`;
            }
            $('prompt').textContent = s.prompt ? `Prompt: ${s.prompt}` : '';
            drawChart();
        }
        const wipe = $('wipe');
        const move = (e) => { const b = ($('stage') || wipe).getBoundingClientRect(); wipeAt = Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)); render(); };
        wipe.onpointerdown = (e) => { wipe.setPointerCapture(e.pointerId); move(e); };
        wipe.onpointermove = (e) => { if (e.buttons) move(e); };
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'SELECT') return;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { col = Math.max(0, Math.min(cols.length - 1, col + (e.key === 'ArrowRight' ? 1 : -1))); render(); e.preventDefault(); }
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { sel = Math.max(0, Math.min(D.samples.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1))); render(); e.preventDefault(); }
        });

        function drawChart() {
            const svg = $('chart'), cur = D.losses.current, eps = D.losses.epochs;
            if (!cur.length) { $('loss-panel').hidden = true; return; }
            $('loss-note').textContent = flattens != null
                ? `Learning flattens around epoch ${flattens} ★. Hover the chart for numbers, click it to jump to that epoch.`
                : 'Hover the chart for numbers, click it to jump to that epoch.';
            const W = svg.clientWidth || 800, H = 240, P = { l: 52, r: 44, t: 10, b: 26 };
            let acc = null;
            const smooth = cur.map(([s, v]) => [s, acc = acc === null ? v : acc * 0.9 + v * 0.1]);
            const ys = smooth.map(p => p[1]).concat(eps.filter(e => e.check != null).map(e => e.check));
            let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.1 || 0.01; lo -= pad; hi += pad;
            const maxStep = cur[cur.length - 1][0] || 1;
            const x = (s) => P.l + s / maxStep * (W - P.l - P.r);
            const y = (v) => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
            let g = '';
            for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(3)}</text>`; }
            const every = Math.max(1, Math.ceil(eps.length / 15));
            eps.forEach((e, i) => { if (i % every === 0 || i === eps.length - 1) g += `<text x="${x(e.step)}" y="${H - 6}" text-anchor="middle">${e.epoch}</text>`; });
            if (flattens != null) { const fs = eps.find(e => e.epoch === flattens).step; g += `<line x1="${x(fs)}" x2="${x(fs)}" y1="${P.t}" y2="${H - P.b}" stroke="var(--good)" stroke-dasharray="4 4"/>`; }
            const selE = eps.find(e => e.epoch === cols[col].epoch);
            if (selE) g += `<line x1="${x(selE.step)}" x2="${x(selE.step)}" y1="${P.t}" y2="${H - P.b}" stroke="var(--text)"/>`;
            g += `<polyline fill="none" stroke="var(--s-train)" stroke-width="2" points="${smooth.map(([s, v]) => `${x(s)},${y(v)}`).join(' ')}"/>`;
            const chk = eps.filter(e => e.check != null);
            if (chk.length) {
                g += `<polyline fill="none" stroke="var(--s-check)" stroke-width="2" stroke-linejoin="round" points="${chk.map(e => `${x(e.step)},${y(e.check)}`).join(' ')}"/>`;
                g += chk.map(e => `<circle cx="${x(e.step)}" cy="${y(e.check)}" r="4" fill="var(--s-check)" stroke="var(--panel)" stroke-width="2"/>`).join('');
            }
            g += `<line id="xhair" y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)" visibility="hidden"/><rect id="hit" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" style="cursor:pointer"/>`;
            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            svg.innerHTML = g;
            if (!eps.length) return;
            const nearest = (ev) => { const px = (ev.clientX - svg.getBoundingClientRect().left) * (W / svg.clientWidth); return eps.reduce((a, b) => (Math.abs(x(b.step) - px) < Math.abs(x(a.step) - px) ? b : a)); };
            const tip = $('tip'), xh = $('xhair');
            $('hit').onmousemove = (ev) => {
                const e = nearest(ev);
                xh.setAttribute('x1', x(e.step)); xh.setAttribute('x2', x(e.step)); xh.setAttribute('visibility', 'visible');
                tip.style.display = 'block'; tip.style.left = ev.clientX + 12 + 'px'; tip.style.top = ev.clientY + 12 + 'px';
                tip.innerHTML = `<strong>Epoch ${e.epoch}</strong>${e.epoch === flattens ? ' ★' : ''}<br>check ${e.check?.toFixed(4) ?? '—'}<br>train ${e.train.toFixed(4)}`;
            };
            $('hit').onmouseleave = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); };
            $('hit').onclick = (ev) => { const i = cols.findIndex(c => c.epoch === nearest(ev).epoch); if (i >= 0) { col = i; render(); } };
        }
        window.onresize = drawChart;
        render();
    </script>
</body>

</html>
